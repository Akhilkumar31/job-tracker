server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jtracker}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:dev-secret-change}
  expiryMinutes: 120

openai:
  baseUrl: https://api.openai.com/v1
  apiKey: ${OPENAI_API_KEY:}

springdoc:
  api-docs.enabled: true
  swagger-ui.path: /swagger

google:
  clientId: ${GOOGLE_CLIENT_ID:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Note: CORS_ALLOWED_ORIGINS env var is read directly by SecurityConfig

jtracker:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:puriakhil74@gmail.com}
  support:
    to-address: ${SUPPORT_TO_ADDRESS:puriakhil74@gmail.com}
